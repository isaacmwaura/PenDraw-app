[package]
name = "app"
version = "0.2.4"
description = "PenDraw - pen-first whiteboard (Tauri desktop shell)"
authors = ["Isaac Mwaura"]
license = "MIT"
repository = "https://github.com/isaacmwaura/PenDraw-app"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["net", "sync", "rt", "macros"] }
futures-util = { version = "0.3", features = ["sink"] }
rust-embed = "8"
mime_guess = "2"
uuid = { version = "1", features = ["v4"] }
local-ip-address = "0.6"

# Windows handwriting recognition (Windows Ink Analysis / InkAnalyzer).
# Only compiled on Windows; the .exe calls this in-process.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
  "Foundation",
  "Foundation_Collections",
  "UI_Input_Inking",
  "UI_Input_Inking_Analysis",
  "Win32_System_WinRT",
  "Win32_Foundation",
  "Win32_Storage_FileSystem",
] }
# In windows-rs 0.61 the core support + collection interfaces live in sibling
# crates; the `implement` macro expands to `windows_core` paths.
windows-core = "0.61"
windows-collections = "0.2"
