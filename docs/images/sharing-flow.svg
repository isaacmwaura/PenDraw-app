<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="310" viewBox="0 0 1200 310" role="img" aria-labelledby="title desc">
<title id="title">Share a PenDraw board in three steps</title><desc id="desc">Start sharing in the Windows app, copy the private sharing link, then open it in an existing browser on another device on the same trusted Wi-Fi. Changes travel both ways.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="#2563eb"/></marker></defs>
<rect width="1200" height="310" rx="24" fill="#eff6ff"/>
<g font-family="Segoe UI,Arial,sans-serif" fill="#183153"><text x="40" y="48" font-size="25" font-weight="700">One board, connected over your Wi-Fi</text>
<g><rect x="40" y="78" width="320" height="156" rx="18" fill="white" stroke="#93c5fd"/><circle cx="75" cy="113" r="18" fill="#2563eb"/><text x="70" y="120" fill="white" font-size="20">1</text><text x="107" y="121" font-size="23" font-weight="700">Start sharing</text><text x="64" y="164" font-size="19">Windows app → Menu → Settings</text><text x="64" y="198" font-size="19">Network → Start sharing</text></g>
<g><rect x="440" y="78" width="320" height="156" rx="18" fill="white" stroke="#93c5fd"/><circle cx="475" cy="113" r="18" fill="#2563eb"/><text x="470" y="120" fill="white" font-size="20">2</text><text x="507" y="121" font-size="23" font-weight="700">Copy the link</text><text x="464" y="164" font-size="19">Share it with your other device</text><text x="464" y="198" font-size="19">Keep PenDraw open</text></g>
<g><rect x="840" y="78" width="320" height="156" rx="18" fill="white" stroke="#93c5fd"/><circle cx="875" cy="113" r="18" fill="#2563eb"/><text x="870" y="120" fill="white" font-size="20">3</text><text x="907" y="121" font-size="23" font-weight="700">Open in a browser</text><text x="864" y="164" font-size="19">Watch or edit the live board</text><text x="864" y="198" font-size="19">Bookmark it for next time</text></g>
<path d="M375 155H423" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/><path d="M775 155H823" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/>
<text x="600" y="275" text-anchor="middle" font-size="19">Edits travel both ways · no Node.js · no account · trusted local network</text></g></svg>
